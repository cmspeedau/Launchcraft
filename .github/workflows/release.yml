name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0-rc.2)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          fi
          VERSION="${TAG#v}"
          PRE=false
          case "$VERSION" in
            *-*) PRE=true ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

  open-release:
    name: Open GitHub release
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse draft-free release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          EXTRA=()
          [ "$PRERELEASE" = "true" ] && EXTRA+=(--prerelease)
          if ! gh --repo "$GITHUB_REPOSITORY" release view "$TAG" >/dev/null 2>&1; then
            gh --repo "$GITHUB_REPOSITORY" release create "$TAG" --title "$TAG" --generate-notes "${EXTRA[@]}"
          fi

  windows:
    name: Windows portable
    needs: [version, open-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --release -p launchcraft-desktop
          cargo build --release -p launchcraft-gui

      - name: Package portable ZIPs
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/launchcraft-desktop.exe dist/Launchcraft.exe
          Compress-Archive -Path dist/Launchcraft.exe `
            -DestinationPath "dist/Launchcraft-$env:VERSION-windows-portable.zip"
          Copy-Item target/release/launchcraft-gui.exe dist/LaunchcraftGUI.exe
          Compress-Archive -Path dist/LaunchcraftGUI.exe `
            -DestinationPath "dist/LaunchcraftGUI-$env:VERSION-windows-portable.zip"
          Get-Item dist/*.zip | Select-Object Name, Length

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Retry: concurrent uploads can draw transient GitHub API errors.
          for i in 1 2 3 4 5; do
            gh --repo "$GITHUB_REPOSITORY" release upload "$TAG" \
              "dist/Launchcraft-${VERSION}-windows-portable.zip" \
              "dist/LaunchcraftGUI-${VERSION}-windows-portable.zip" --clobber && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 5))
          done

  macos:
    name: macOS universal
    needs: [version, open-release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build Apple Silicon binaries
        run: |
          cargo build --release -p launchcraft-desktop
          cargo build --release -p launchcraft-gui

      - name: Build Intel binaries
        run: |
          cargo build --release -p launchcraft-desktop --target x86_64-apple-darwin
          cargo build --release -p launchcraft-gui --target x86_64-apple-darwin

      - name: Create universal binaries and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir dist
          lipo -create \
            target/release/launchcraft-desktop \
            target/x86_64-apple-darwin/release/launchcraft-desktop \
            -output dist/Launchcraft
          lipo -info dist/Launchcraft
          chmod +x dist/Launchcraft
          zip -j "dist/Launchcraft-${VERSION}-macos-universal.zip" dist/Launchcraft
          lipo -create \
            target/release/launchcraft-gui \
            target/x86_64-apple-darwin/release/launchcraft-gui \
            -output dist/LaunchcraftGUI
          lipo -info dist/LaunchcraftGUI
          chmod +x dist/LaunchcraftGUI
          zip -j "dist/LaunchcraftGUI-${VERSION}-macos-universal.zip" dist/LaunchcraftGUI
          for i in 1 2 3 4 5; do
            gh --repo "$GITHUB_REPOSITORY" release upload "$TAG" \
              "dist/Launchcraft-${VERSION}-macos-universal.zip" \
              "dist/LaunchcraftGUI-${VERSION}-macos-universal.zip" --clobber && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 5))
          done

  linux-appimage:
    name: Linux AppImage
    needs: [version, open-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libzstd-dev build-essential \
            squashfs-tools desktop-file-utils librsvg2-bin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p launchcraft-desktop

      - name: Render icons
        run: |
          rsvg-convert -w 256 -h 256 \
            apps/launchcraft-desktop/packaging/launchcraft.svg \
            -o launchcraft.png
          desktop-file-validate apps/launchcraft-desktop/packaging/launchcraft.desktop

      - name: Build AppImage with zsync update information
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: x86_64
          LDAI_UPDATE_INFORMATION: "gh-releases-zsync|cmspeedau|Launchcraft|latest|Launchcraft*AppImage.zsync"
        # NOTE: do not set APPIMAGE_EXTRACT_AND_RUN here; appimagetool inherits
        # it and its extract-and-run mode loses the finished AppImage output.
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir "$PWD/AppDir" \
            -e target/release/launchcraft-desktop \
            -d apps/launchcraft-desktop/packaging/launchcraft.desktop \
            -i launchcraft.png \
            --output appimage

      - name: Smoke test AppImage
        run: |
          chmod +x Launchcraft-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./Launchcraft-*.AppImage

      - name: Attach AppImage and zsync to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          for i in 1 2 3 4 5; do
            gh --repo "$GITHUB_REPOSITORY" release upload "$TAG" \
              Launchcraft-*.AppImage Launchcraft-*.AppImage.zsync --clobber && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 5))
          done

  linux-gui:
    name: Linux GUI client
    needs: [version, open-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libzstd-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p launchcraft-gui

      - name: Package tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/LaunchcraftGUI-${VERSION}-linux-x86_64.tar.gz" launchcraft-gui

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          for i in 1 2 3 4 5; do
            gh --repo "$GITHUB_REPOSITORY" release upload "$TAG" \
              dist/LaunchcraftGUI-*-linux-x86_64.tar.gz --clobber && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 5))
          done

  docker:
    name: Docker image
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/launchcraft:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/launchcraft:${{ needs.version.outputs.prerelease == 'true' && 'rc' || 'latest' }}
