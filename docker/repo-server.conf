# Static pack distribution server for Launchcraft repositories.
# Serves the builder output (./dist mounted read-only at the web root):
#   GET /manifest.json      -> built manifest
#   GET /cas/objects/<xx>/<hash> -> CAS blobs (current builder layout)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    default_type application/octet-stream;

    # Browseable object store; manifest resolves by exact path.
    autoindex on;
    charset off;

    # CAS blobs are content-addressed and immutable: cache forever.
    location /cas/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location /manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri =404;
    }
}
