<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launchcraft</title>
  <style>
    :root {
      --bg: #121316;
      --card-bg: #1c1d22;
      --accent: #22c55e;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2d3039;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 1.25rem; font-weight: bold; color: var(--accent); }
    main {
      flex: 1;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 1.5rem;
      overflow: hidden;
    }
    .sidebar {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid var(--border);
    }
    .content-area {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
    .log-view {
      flex: 1;
      background: #090a0c;
      border-radius: 6px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      color: #10b981;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Launchcraft</div>
    <div id="account-status">No account selected</div>
  </header>
  <main>
    <aside class="sidebar">
      <h3>Modpacks</h3>
      <div id="instance-list" style="margin-top: 1rem;">
        <p style="color: var(--text-muted); font-size: 0.9rem;">No instances found.</p>
      </div>
    </aside>
    <section class="content-area">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 id="active-instance">Launchcraft Instance</h2>
        <button class="btn" id="launch-btn">Play</button>
      </div>
      <div class="log-view" id="log-console">
        [Launchcraft Core] Ready. Select or configure an instance to play.
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
