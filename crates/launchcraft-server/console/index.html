<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launchcraft Server</title>
<style>
:root {
  --bg-primary: #121214;
  --bg-secondary: #1a1a1e;
  --bg-surface: #222228;
  --accent: #10b981;
  --accent-hover: #059669;
  --danger: #ef4444;
  --text-main: #f3f4f6;
  --text-muted: #9ca3af;
  --border: #2e2e38;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-primary); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
aside { width: 220px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.25rem .75rem; flex-shrink: 0; }
.brand { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: .35rem; display: flex; align-items: center; gap: .5rem; padding-left: .5rem; }
.brand span { color: var(--accent); }
.subtitle { font-size: .72rem; color: var(--text-muted); padding-left: .5rem; margin-bottom: 2rem; letter-spacing: .08em; text-transform: uppercase; }
nav button { width: 100%; text-align: left; background: none; border: none; color: var(--text-muted); padding: .65rem .75rem; border-radius: 6px; cursor: pointer; font-size: .9rem; font-weight: 500; margin-bottom: .35rem; transition: all .15s; }
nav button:hover { background: var(--bg-surface); color: #fff; }
nav button.active { background: var(--accent); color: #fff; }
.token-box { margin-top: auto; border-top: 1px solid var(--border); padding-top: .9rem; }
.token-box label { display: block; font-size: .7rem; color: var(--text-muted); margin: 0 0 .35rem .5rem; text-transform: uppercase; letter-spacing: .06em; }
.token-box input { width: 100%; background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; padding: .45rem .6rem; font-size: .8rem; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.token-box input:focus { outline: none; border-color: var(--accent); }
main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 1.5rem; }
.header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
.header-title { font-size: 1.35rem; font-weight: 600; }
.status-line { font-size: .8rem; color: var(--text-muted); }
.status-line.err { color: var(--danger); }
.view { display: none; }
.view.active { display: block; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
.card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
.card-label { font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .5rem; }
.card-value { font-size: 1.6rem; font-weight: 700; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent); word-break: break-all; }
.card-value.small { font-size: .95rem; color: var(--text-main); }
table.file-table { width: 100%; border-collapse: collapse; background: var(--bg-secondary); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.file-table th, .file-table td { padding: .7rem .9rem; text-align: left; font-size: .85rem; border-bottom: 1px solid var(--border); }
.file-table th { background: var(--bg-surface); color: var(--text-muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
.file-table tr:last-child td { border-bottom: none; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .8rem; }
.dim { color: var(--text-muted); }
.btn { background: var(--bg-surface); color: #fff; border: 1px solid var(--border); padding: .45rem .85rem; border-radius: 6px; cursor: pointer; font-size: .85rem; font-weight: 500; display: inline-flex; align-items: center; gap: .4rem; }
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger:hover { background: var(--danger); border-color: var(--danger); }
.action-group { display: flex; gap: .5rem; }
.badge { font-size: .75rem; padding: .2rem .55rem; border-radius: 4px; font-weight: 600; display: inline-block; }
.badge-success { background: #064e3b; color: #34d399; }
.badge-disabled { background: #451a1a; color: #f87171; }
.badge-neutral { background: var(--bg-surface); color: var(--text-muted); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .75rem; }
.form-grid label { display: block; font-size: .7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .3rem; }
.field-input { width: 100%; background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; padding: .45rem .6rem; font-size: .85rem; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.field-input:focus { outline: none; border-color: var(--accent); }
.row-actions .btn { padding: .3rem .55rem; font-size: .75rem; }
.policy-row { display: flex; align-items: center; gap: 1rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem 1.5rem; }
.switch { position: relative; width: 52px; height: 28px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; transition: .15s; }
.slider::before { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: var(--text-muted); border-radius: 50%; transition: .15s; }
.switch input:checked + .slider { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(24px); background: #fff; }
.empty { padding: 2.5rem; text-align: center; color: var(--text-muted); background: var(--bg-secondary); border: 1px dashed var(--border); border-radius: 8px; }
</style>
</head>
<body>

<aside>
  <div class="brand">Launch<span>craft</span></div>
  <div class="subtitle">Server Console</div>
  <nav>
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="backups">Backups</button>
    <button data-view="policy">Policy</button>
    <button data-view="packs">Pack Manager</button>
  </nav>
  <div class="token-box">
    <label for="token">Bearer token</label>
    <input id="token" type="password" placeholder="leave empty if open">
  </div>
</aside>

<main>
  <div class="header-bar">
    <div class="header-title" id="view-title">Dashboard</div>
    <div class="status-line" id="status">Ready</div>
  </div>

  <section class="view active" id="view-dashboard">
    <div class="card-grid">
      <div class="card"><div class="card-label">Archives</div><div class="card-value" id="st-count">–</div></div>
      <div class="card"><div class="card-label">Stored</div><div class="card-value" id="st-bytes">–</div></div>
      <div class="card"><div class="card-label">Upload policy</div><div class="card-value" id="st-policy">–</div></div>
      <div class="card"><div class="card-label">Newest archive</div><div class="card-value small" id="st-newest">–</div></div>
    </div>
    <div id="worlds-table"></div>
  </section>

  <section class="view" id="view-backups">
    <div class="header-bar">
      <div></div>
      <button class="btn" id="btn-refresh">Refresh</button>
    </div>
    <div id="backups-table"></div>
  </section>

  <section class="view" id="view-policy">
    <div class="policy-row">
      <label class="switch">
        <input type="checkbox" id="policy-toggle">
        <span class="slider"></span>
      </label>
      <div>
        <strong>Accept cloud uploads</strong>
        <div class="dim" style="font-size:.85rem;margin-top:.25rem">
          Mirrors <span class="mono">server_backups_enabled</span>. While off, the API answers
          <span class="mono">403</span> to <span class="mono">POST /api/backups/upload</span> and clients skip uploads by policy.
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="view-packs">
    <div class="header-bar">
      <div></div>
      <div class="action-group">
        <button class="btn btn-primary" id="pack-new">+ New Pack</button>
        <button class="btn" id="pack-add">Add Existing</button>
        <button class="btn" id="pack-refresh">Refresh</button>
      </div>
    </div>
    <div id="pack-form" class="card" style="display:none;margin-bottom:1.25rem">
      <div class="card-label" id="pack-form-title">New Pack</div>
      <div class="form-grid">
        <div><label for="pf-id">Name (id)</label><input id="pf-id" class="field-input" placeholder="alice-1.7"></div>
        <div><label for="pf-title">Title</label><input id="pf-title" class="field-input" placeholder="Alice 1.7"></div>
        <div><label for="pf-game">Game version</label><input id="pf-game" class="field-input" placeholder="1.21.4"></div>
        <div><label for="pf-src">Source dir (server path)</label><input id="pf-src" class="field-input" placeholder="/srv/packs/alice/src"></div>
        <div><label for="pf-dist">Dist dir (server path)</label><input id="pf-dist" class="field-input" placeholder="/srv/packs/alice/dist"></div>
      </div>
      <div class="action-group" style="margin-top:.9rem">
        <button class="btn btn-primary" id="pf-save">Save</button>
        <button class="btn" id="pf-cancel">Cancel</button>
      </div>
    </div>
    <div id="packs-body"><div class="empty">No pack data.</div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const tokenEl = $("token");
tokenEl.value = localStorage.getItem("lc_token") || "";
tokenEl.addEventListener("input", () => {
  localStorage.setItem("lc_token", tokenEl.value);
  loadCurrent();
});

function headers() {
  const t = tokenEl.value.trim();
  return t ? { Authorization: "Bearer " + t } : {};
}
function status(msg, isErr) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status-line" + (isErr ? " err" : "");
}
function humanSize(n) {
  if (!Number.isFinite(n)) return "–";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + " " + u[i];
}
async function getJSON(url, opts = {}) {
  const res = await fetch(url, { ...opts, headers: { ...headers(), ...(opts.headers || {}) } });
  if (!res.ok) {
    let msg = res.status + " " + res.statusText;
    try { msg += " — " + (await res.json()).message; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json().catch(() => ({}));
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function loadDashboard() {
  const [s, list] = await Promise.all([getJSON("/console/stats"), getJSON("/api/backups")]);
  $("st-count").textContent = s.archive_count;
  $("st-bytes").textContent = humanSize(s.total_bytes);
  $("st-newest").textContent = s.newest || "none";
  const on = list.server_backups_enabled;
  $("st-policy").innerHTML = "";
  $("st-policy").appendChild(el("span", "badge " + (on ? "badge-success" : "badge-disabled"), on ? "enabled" : "disabled"));
  const box = $("worlds-table");
  box.innerHTML = "";
  if (!s.worlds.length) { box.appendChild(el("div", "empty", "No worlds have uploaded yet.")); return; }
  const t = el("table", "file-table");
  const head = el("tr"); head.appendChild(el("th", null, "World")); head.appendChild(el("th", null, "Archives"));
  t.appendChild(head);
  for (const w of s.worlds) {
    const tr = el("tr");
    tr.appendChild(el("td", null, w.world));
    tr.appendChild(el("td", "mono", w.count));
    t.appendChild(tr);
  }
  box.appendChild(t);
}

async function loadBackups() {
  const list = await getJSON("/api/backups");
  const box = $("backups-table");
  box.innerHTML = "";
  if (!list.backups.length) { box.appendChild(el("div", "empty", "No backups uploaded yet — the client's World Saves tab pushes them here.")); return; }
  const t = el("table", "file-table");
  const head = el("tr");
  for (const h of ["Archive", "World", "Size", "Uploaded", "BLAKE3", ""]) head.appendChild(el("th", null, h));
  t.appendChild(head);
  for (const b of list.backups) {
    const tr = el("tr");
    tr.appendChild(el("td", "mono", b.file_name));
    tr.appendChild(el("td", null, b.world_name));
    tr.appendChild(el("td", "mono", humanSize(b.size_bytes)));
    tr.appendChild(el("td", "dim", b.timestamp.slice(0, 19).replace("T", " ")));
    tr.appendChild(el("td", "mono dim", b.checksum_blake3.slice(0, 10)));
    const td = el("td");
    const group = el("div", "action-group");
    const dl = el("button", "btn", "Download");
    dl.onclick = () => download(b.file_name);
    const del = el("button", "btn btn-danger", "Delete");
    del.onclick = () => remove(b.file_name);
    group.appendChild(dl); group.appendChild(del);
    td.appendChild(group);
    tr.appendChild(td);
    t.appendChild(tr);
  }
  box.appendChild(t);
}

async function download(name) {
  try {
    const res = await fetch("/api/backups/download?filename=" + encodeURIComponent(name), { headers: headers() });
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const url = URL.createObjectURL(await res.blob());
    const a = el("a"); a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
    status("Downloaded " + name);
  } catch (e) { status("Download failed: " + e.message, true); }
}

async function remove(name) {
  if (!confirm("Delete " + name + " from the server?")) return;
  try {
    await getJSON("/api/backups/" + encodeURIComponent(name), { method: "DELETE" });
    status("Deleted " + name);
    loadCurrent();
  } catch (e) { status("Delete failed: " + e.message, true); }
}

async function loadPolicy() {
  const p = await getJSON("/console/policy");
  $("policy-toggle").checked = p.server_backups_enabled;
}
$("policy-toggle").addEventListener("change", async (ev) => {
  try {
    await getJSON("/console/policy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ server_backups_enabled: ev.target.checked }),
    });
    status("Upload policy set to " + (ev.target.checked ? "enabled" : "disabled"));
  } catch (e) {
    ev.target.checked = !ev.target.checked;
    status("Policy update failed: " + e.message, true);
  }
});

async function loadPacks() {
  const box = $("packs-body");
  box.innerHTML = "";
  const data = await getJSON("/console/packs");
  if (!data.packs.length) {
    box.appendChild(el("div", "empty", "No packs registered. Create one with New Pack, or register a built directory with Add Existing."));
    return;
  }
  const t = el("table", "file-table");
  const head = el("tr");
  for (const h of ["Name", "Title", "Game", "Version", "Files", "Location", "Status", ""]) head.appendChild(el("th", null, h));
  t.appendChild(head);
  for (const p of data.packs) {
    const tr = el("tr");
    tr.appendChild(el("td", "mono", p.id));
    tr.appendChild(el("td", null, p.title));
    tr.appendChild(el("td", "mono", p.game_version || "–"));
    tr.appendChild(el("td", "mono", p.pack_version || "–"));
    tr.appendChild(el("td", "mono", p.status === "ok" ? p.file_count + " · " + humanSize(p.total_bytes) : "–"));
    tr.appendChild(el("td", "mono dim", p.dist));
    const st = el("td");
    const cls = { ok: "badge-success", "not-built": "badge-neutral", error: "badge-disabled" }[p.status] || "badge-neutral";
    st.appendChild(el("span", "badge " + cls, p.error ? "error" : p.status));
    tr.appendChild(st);
    const td = el("td");
    const group = el("div", "action-group row-actions");
    const mk = (label, cls, fn) => { const b = el("button", "btn " + cls, label); b.onclick = fn; return b; };
    group.appendChild(mk("Modify", "", () => openPackForm("modify", p)));
    group.appendChild(mk("Check", "", () => packAction(p.id, "check")));
    group.appendChild(mk("Build", "", () => packAction(p.id, "build")));
    group.appendChild(mk("Remove", "btn-danger", () => packAction(p.id, "remove")));
    td.appendChild(group);
    tr.appendChild(td);
    t.appendChild(tr);
  }
  box.appendChild(t);
}

function openPackForm(mode, row) {
  packFormMode = mode;
  packFormId = mode === "modify" ? row.id : null;
  const titles = { new: "New Pack", add: "Add Existing", modify: "Modify Pack" };
  $("pack-form-title").textContent = titles[mode];
  $("pf-id").value = mode === "modify" ? row.id : "";
  $("pf-id").disabled = mode === "modify";
  $("pf-title").value = mode === "modify" ? row.title : "";
  $("pf-game").value = "";
  $("pf-game").closest("div").style.display = mode === "add" ? "none" : "";
  $("pf-src").value = mode === "modify" ? (row.src || "") : "";
  $("pf-src").closest("div").style.display = mode === "new" ? "none" : "";
  $("pf-dist").value = mode === "modify" ? row.dist : "";
  $("pf-dist").closest("div").style.display = mode === "new" ? "none" : "";
  $("pack-form").style.display = "block";
}
function closePackForm() {
  packFormMode = null;
  $("pack-form").style.display = "none";
}

async function submitPackForm() {
  if (!packFormMode) return;
  const id = $("pf-id").value.trim();
  const title = $("pf-title").value.trim() || id;
  try {
    if (packFormMode === "new") {
      await getJSON("/console/packs/new", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, title, game_version: $("pf-game").value.trim() || null }) });
      status("Created pack " + id + " — drop mods/configs into its source dir, then Build");
    } else if (packFormMode === "add") {
      await getJSON("/console/packs", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, title, src: $("pf-src").value.trim() || null, dist: $("pf-dist").value.trim() }) });
      status("Registered pack " + id);
    } else {
      await getJSON("/console/packs/" + encodeURIComponent(packFormId), { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, src: $("pf-src").value.trim() || null, dist: $("pf-dist").value.trim() || null }) });
      status("Updated pack " + packFormId);
    }
    closePackForm();
    loadCurrent();
  } catch (e) { status("Save failed: " + e.message, true); }
}

async function packAction(id, action) {
  if (action === "remove" && !confirm("Unregister " + id + "? Files on disk are kept.")) return;
  try {
    if (action === "check") {
      status("Checking " + id + "…");
      const r = await getJSON("/console/packs/" + encodeURIComponent(id) + "/check", { method: "POST" });
      status(r.ok
        ? "✓ " + id + ": all " + r.files + " files verified (BLAKE3)"
        : "✗ " + id + ": " + (r.error || (r.missing + " missing blob(s), " + r.hash_mismatch + " hash mismatch(es)") + " — " + (r.problems[0] || "")), !r.ok);
    } else if (action === "build") {
      status("Building " + id + "…");
      const r = await getJSON("/console/packs/" + encodeURIComponent(id) + "/build", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      status("Built " + id + " v" + r.pack_version + " — " + r.file_count + " files, " + humanSize(r.total_bytes));
      loadCurrent();
    } else {
      await getJSON("/console/packs/" + encodeURIComponent(id), { method: "DELETE" });
      status("Unregistered " + id);
      loadCurrent();
    }
  } catch (e) { status(action + " failed: " + e.message, true); loadCurrent(); }
}

let packFormMode = null, packFormId = null;

const loaders = { dashboard: loadDashboard, backups: loadBackups, policy: loadPolicy, packs: loadPacks };
let current = "dashboard";
function loadCurrent() {
  status("Loading…");
  loaders[current]().then(() => status("Ready")).catch((e) => status(e.message, true));
}
document.querySelectorAll("nav button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    btn.classList.add("active");
    current = btn.dataset.view;
    $("view-" + current).classList.add("active");
    $("view-title").textContent = btn.textContent;
    loadCurrent();
  });
});
$("btn-refresh").addEventListener("click", loadCurrent);
$("pack-new").addEventListener("click", () => openPackForm("new"));
$("pack-add").addEventListener("click", () => openPackForm("add"));
$("pack-refresh").addEventListener("click", loadCurrent);
$("pf-save").addEventListener("click", submitPackForm);
$("pf-cancel").addEventListener("click", closePackForm);
loadCurrent();
</script>
</body>
</html>
