# Launchcraft headless modpack builder + local pack repository.
#
# The `builder` service is a one-shot job, so use `docker compose run`:
#
#   docker compose run --rm builder init \
#       --path /workspace/pack/pack.json             # scaffold build config
#   docker compose run --rm builder                  # build ./pack -> ./dist
#   docker compose run --rm builder build \
#       --config /workspace/pack/pack.json           # build with explicit config
#
# The `repo-server` service publishes ./dist over HTTP so Launchcraft
# clients can sync the pack (manifest.json + CAS blobs):
#
#   docker compose up -d repo-server                 # serve on http://localhost:8080
#   docker compose up -d backup-server               # backup API + admin console on http://localhost:9090
#   docker compose logs -f repo-server
#   docker compose down
#
# The image published by the release workflow is private (the repository is);
# either `docker login ghcr.io` first, or let Compose build it locally from
# the Dockerfile in this repository (the default when the image is absent).
#
# Notes:
#   - The container runs as root, so files written into ./dist are root-owned.
#   - RUST_LOG=debug docker compose run --rm builder   # verbose logging

name: launchcraft

services:
  builder:
    # Published image, falling back to a local build of this Dockerfile
    # when the image is not present. Pin a version (e.g. :v0.1.0-rc.2)
    # for reproducible builds.
    image: ghcr.io/cmspeedau/launchcraft:rc
    build: .
    pull_policy: missing
    working_dir: /workspace
    volumes:
      - ./pack:/workspace/pack
      - ./dist:/workspace/dist
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    # One-shot build tool: exit normally, never restart.
    init: true
    restart: "no"

  repo-server:
    # Static pack repository: serves ./dist (manifest.json + cas/objects/...)
    # to launching clients. Point an instance's repository URL at
    # http://localhost:8080 after `docker compose run --rm builder`.
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${REPO_PORT:-8080}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/repo-server.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  backup-server:
    # World backup API + admin console (http://localhost:9090).
    # Set an instance's "Backup server URL" to http://localhost:9090/api.
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    ports:
      - "${BACKUP_PORT:-9090}:9090"
    volumes:
      - ./server-data:/data
      # Read-only view of the built pack, for the console's Packs tab.
      - ./dist:/repo/dist:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      LAUNCHCRAFT_REPO_DIST: /repo/dist
      # Leave empty for an open API on a trusted LAN; set to require
      # Authorization: Bearer on every data endpoint.
      LAUNCHCRAFT_BACKUP_TOKEN: ${LAUNCHCRAFT_BACKUP_TOKEN:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
