[workspace]
members = [
    "crates/*",
    "apps/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Launchcraft Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
blake3 = "1.5"
zstd = "0.13"
directories = "5.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
rayon = "1.10"
futures = "0.3"
futures-util = "0.3"
tempfile = "3.10"
async-trait = "0.1"
base64 = "0.22"
